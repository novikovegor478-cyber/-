<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для Гелечки ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 1. Падающие буквы на фоне
    const letters = "LOVE❤️IYOU01";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    // 2. Генерация точек для надписи
    let textDots = [];
    function createTextDots() {
      textDots = [];
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;

      const lines = [
        "Гелечка",
        "я тебя безумно",
        "люблю"
      ];

      // Автоматический расчет размера шрифта под ширину экрана телефона и ПК
      const longestLine = Math.max(...lines.map(line => line.length));
      const textSize = Math.min((canvas.width * 0.88) / (longestLine * 0.6), 130);
      const lineHeight = textSize * 1.25;

      tempCtx.font = `bold ${textSize}px sans-serif`;
      tempCtx.fillStyle = "white";
      tempCtx.textAlign = "center";
      tempCtx.textBaseline = "middle";

      const totalHeight = lines.length * lineHeight;
      const startY = (canvas.height - totalHeight) / 2 + lineHeight / 2;

      lines.forEach((line, index) => {
        tempCtx.fillText(line, canvas.width / 2, startY + index * lineHeight);
      });

      const imageData = tempCtx.getImageData(0, 0, canvas.width, canvas.height).data;
      const gap = 5; // Плотность точек (сделал чуть чаще для хорошей читаемости)

      for (let y = 0; y < canvas.height; y += gap) {
        for (let x = 0; x < canvas.width; x += gap) {
          const index = (y * canvas.width + x) * 4;
          if (imageData[index + 3] > 128) {
            textDots.push({
              x: x,
              y: y,
              baseRadius: Math.random() * 1.1 + 1.1,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
      }
    }

    createTextDots();

    // 3. Цикл анимации
    let frame = 0;
    function draw() {
      ctx.fillStyle = "rgba(5, 5, 5, 0.12)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff2a6d";
      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const char = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }

      frame += 0.05;
      for (let dot of textDots) {
        const pulse = Math.sin(frame + dot.phase) * 0.7;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, Math.max(0.5, dot.baseRadius + pulse), 0, Math.PI * 2);
        ctx.fillStyle = "#ff758f";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff0a54";
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(draw);
    }

    draw();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createTextDots();
    });
  </script>
</body>
</html>
